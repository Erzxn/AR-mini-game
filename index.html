<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Farm 3D - Low Poly Quiz Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Prompt', sans-serif;
            user-select: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
        }
        .hud-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }
        .crop-card-selected {
            border: 3px solid #22c55e !important;
            background: #dcfce7 !important;
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.25);
        }
    </style>
</head>
<body class="relative w-screen h-screen">

    <!-- 3D Canvas -->
    <div id="canvas-container" class="w-full h-full cursor-grab active:cursor-grabbing"></div>

    <!-- Top Left: ยอดเงิน -->
    <div class="absolute top-4 left-4 z-20 pointer-events-auto">
        <div class="hud-glass rounded-2xl px-5 py-2.5 flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-amber-400 flex items-center justify-center text-white text-xl shadow-inner font-bold border-2 border-amber-300">
                🪙
            </div>
            <div>
                <div class="text-[11px] text-slate-500 font-bold tracking-wider">ยอดเงิน</div>
                <div id="coin-display" class="text-2xl font-black text-slate-800 leading-tight">100</div>
            </div>
        </div>
    </div>

    <!-- Top Right: คลังผลผลิต & ขาย -->
    <div class="absolute top-4 right-4 z-20 flex flex-col items-end gap-2 pointer-events-auto">
        <div class="hud-glass rounded-2xl px-5 py-2.5 flex items-center gap-3">
            <span class="text-xl">📦</span>
            <div class="text-right">
                <div class="text-[11px] text-slate-500 font-bold">คลังผลผลิต</div>
                <div class="text-base font-black text-slate-800"><span id="inventory-count">0</span> ชิ้น</div>
            </div>
        </div>
        <button id="sell-all-btn" class="bg-gradient-to-r from-emerald-500 to-green-500 hover:from-emerald-600 hover:to-green-600 active:scale-95 text-white font-bold px-6 py-2 rounded-xl shadow-lg border-2 border-emerald-400 transition-all flex items-center gap-2 cursor-pointer">
            <span>ขายทั้งหมด</span>
            <span id="sell-value" class="text-xs bg-emerald-700/50 px-2 py-0.5 rounded-full">(+0🪙)</span>
        </button>
    </div>

    <!-- Floating Toast / Notification -->
    <div id="toast-msg" class="absolute top-20 left-1/2 -translate-x-1/2 z-30 opacity-0 pointer-events-none transition-all duration-300 bg-slate-900/85 text-white text-sm font-bold px-5 py-2.5 rounded-full backdrop-blur-md border border-white/20 shadow-xl">
        ข้อความแจ้งเตือน
    </div>

    <!-- Bottom Center HUD: แท็บเมล็ดพันธุ์ & การก่อสร้าง -->
    <div class="absolute bottom-5 left-1/2 -translate-x-1/2 z-20 w-full max-w-lg px-4 pointer-events-auto">
        <div class="hud-glass rounded-3xl p-3 shadow-2xl">
            <!-- Selected Item Preview Banner -->
            <div class="text-center mb-2">
                <span id="selected-banner" class="inline-block bg-white/95 border border-slate-200 text-slate-700 font-bold text-xs px-4 py-1 rounded-full shadow-sm">
                    🌱 กำลังเลือก: มะเขือเทศ (ปลูก 5 วิ)
                </span>
            </div>

            <!-- Tab Switcher -->
            <div class="flex justify-center gap-2 mb-3 border-b border-slate-200 pb-2">
                <button id="tab-crops-btn" class="text-xs font-bold px-4 py-1.5 rounded-full bg-emerald-500 text-white shadow-sm transition-all flex items-center gap-1.5 cursor-pointer">
                    <span>🌱</span> เมล็ดพันธุ์
                </button>
                <button id="tab-build-btn" class="text-xs font-bold px-4 py-1.5 rounded-full bg-white/70 text-slate-600 hover:bg-white transition-all flex items-center gap-1.5 cursor-pointer">
                    <span>🔨</span> ก่อสร้าง
                </button>
            </div>

            <!-- Panel 1: เมล็ดพันธุ์ -->
            <div id="crops-panel" class="grid grid-cols-3 gap-2.5">
                <button class="crop-btn crop-card-selected bg-white/80 rounded-2xl p-2.5 flex flex-col items-center border border-slate-200 transition-all cursor-pointer" data-crop="tomato">
                    <span class="text-3xl mb-1">🍅</span>
                    <span class="text-xs font-bold text-slate-800">มะเขือเทศ</span>
                    <div class="text-[10px] text-slate-500 mt-0.5">ทุน <b class="text-red-500">10</b> | ขาย <b class="text-emerald-600">25</b></div>
                </button>
                <button class="crop-btn bg-white/80 rounded-2xl p-2.5 flex flex-col items-center border border-slate-200 transition-all hover:bg-white cursor-pointer" data-crop="carrot">
                    <span class="text-3xl mb-1">🥕</span>
                    <span class="text-xs font-bold text-slate-800">แครอท</span>
                    <div class="text-[10px] text-slate-500 mt-0.5">ทุน <b class="text-amber-500">20</b> | ขาย <b class="text-emerald-600">60</b></div>
                </button>
                <button class="crop-btn bg-white/80 rounded-2xl p-2.5 flex flex-col items-center border border-slate-200 transition-all hover:bg-white cursor-pointer" data-crop="cabbage">
                    <span class="text-3xl mb-1">🥬</span>
                    <span class="text-xs font-bold text-slate-800">กะหล่ำปลี</span>
                    <div class="text-[10px] text-slate-500 mt-0.5">ทุน <b class="text-emerald-600">50</b> | ขาย <b class="text-emerald-600">200</b></div>
                </button>
            </div>

            <!-- Panel 2: ก่อสร้าง -->
            <div id="build-panel" class="hidden grid grid-cols-2 gap-3">
                <button id="btn-expand-plot" class="bg-white/80 rounded-2xl p-3 flex flex-col items-center border border-slate-200 hover:bg-white transition-all active:scale-95 cursor-pointer">
                    <span class="text-3xl mb-1">🔲</span>
                    <span id="plot-upgrade-title" class="text-xs font-bold text-slate-800">ขยายแปลง (6/12)</span>
                    <div class="text-[11px] font-bold text-amber-600 mt-1 flex items-center gap-1">
                        <span>🪙 150</span>
                        <span class="text-[9px] text-slate-400 font-normal">(+1 แปลง)</span>
                    </div>
                </button>
                <button id="btn-upgrade-house" class="bg-white/80 rounded-2xl p-3 flex flex-col items-center border border-slate-200 hover:bg-white transition-all active:scale-95 cursor-pointer">
                    <span class="text-3xl mb-1">🏠</span>
                    <span id="house-upgrade-title" class="text-xs font-bold text-slate-800">ต่อเติมบ้าน Lv.2</span>
                    <div class="text-[11px] font-bold text-amber-600 mt-1">🪙 300</div>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Robot Quiz Popup -->
    <div id="quiz-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="hud-glass rounded-3xl max-w-sm w-full p-6 text-center border-2 border-white shadow-2xl transform scale-95 transition-transform duration-200">
            <div class="w-16 h-16 mx-auto mb-2 bg-blue-500 rounded-2xl flex items-center justify-center text-3xl shadow-lg border-2 border-white animate-bounce">
                🤖
            </div>
            <h3 class="text-xl font-black text-slate-800">ควิซหุ่นยนต์รดน้ำ!</h3>
            <p class="text-xs text-slate-600 mt-1 mb-4">
                ตอบถูก: หุ่นยนต์จะฉีดน้ำรดแปลงผักทั้งหมดทันที!<br>
                <span class="text-red-500 text-[11px] font-bold">*เมล็ดจะไม่โตถ้าหุ่นยนต์ยังไม่ได้รดน้ำ*</span>
            </p>

            <div class="bg-white/90 border border-slate-200 rounded-2xl py-4 px-6 mb-4 shadow-inner">
                <span id="quiz-question" class="text-3xl font-black text-slate-800 tracking-wider">4 * 5 = ?</span>
            </div>

            <div id="quiz-options" class="grid grid-cols-2 gap-2.5"></div>

            <button id="quiz-close-btn" class="mt-4 text-xs font-bold text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
                ปิดหน้าต่าง
            </button>
        </div>
    </div>

    <!-- Logic Script & Web Audio Synthesizer -->
    <script>
        // Web Audio Sound Engine (ไม่ต้องโหลดไฟล์นอก)
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'plant') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(320, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'robot') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(880, now + 0.08);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'water') {
                    // White noise buffer for water splash
                    const bufferSize = ctx.sampleRate * 0.4;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 1200;
                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);
                    noise.start(now);
                } else if (type === 'wrong') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.28);
                } else if (type === 'mature') {
                    const notes = [523.25, 659.25, 783.99, 1046.5];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        const t = now + idx * 0.06;
                        gain.gain.setValueAtTime(0.12, t);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(t);
                        osc.stop(t + 0.15);
                    });
                } else if (type === 'harvest') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.18);
                } else if (type === 'sell') {
                    const coinsNotes = [987.77, 1318.51];
                    coinsNotes.forEach((f, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = f;
                        const t = now + i * 0.08;
                        gain.gain.setValueAtTime(0.2, t);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(t);
                        osc.stop(t + 0.25);
                    });
                } else if (type === 'build') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(450, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch (e) {
                console.warn(e);
            }
        }

        // Game State
        let coins = 100;
        let inventory = [];
        let selectedCrop = 'tomato';
        let activePlotsCount = 6;
        let houseLevel = 1;

        const CROP_CONFIG = {
            tomato: { name: 'มะเขือเทศ', icon: '🍅', cost: 10, sell: 25, growTime: 5, color: 0xef4444 },
            carrot: { name: 'แครอท', icon: '🥕', cost: 20, sell: 60, growTime: 7, color: 0xf97316 },
            cabbage: { name: 'กะหล่ำปลี', icon: '🥬', cost: 50, sell: 200, growTime: 10, color: 0x22c55e }
        };

        const coinDisplay = document.getElementById('coin-display');
        const invCount = document.getElementById('inventory-count');
        const sellValue = document.getElementById('sell-value');
        const sellAllBtn = document.getElementById('sell-all-btn');
        const toastMsg = document.getElementById('toast-msg');
        const selectedBanner = document.getElementById('selected-banner');
        const cropsPanel = document.getElementById('crops-panel');
        const buildPanel = document.getElementById('build-panel');
        const tabCropsBtn = document.getElementById('tab-crops-btn');
        const tabBuildBtn = document.getElementById('tab-build-btn');
        const btnExpandPlot = document.getElementById('btn-expand-plot');
        const plotUpgradeTitle = document.getElementById('plot-upgrade-title');
        const btnUpgradeHouse = document.getElementById('btn-upgrade-house');
        const houseUpgradeTitle = document.getElementById('house-upgrade-title');
        const quizModal = document.getElementById('quiz-modal');
        const quizQuestion = document.getElementById('quiz-question');
        const quizOptions = document.getElementById('quiz-options');
        const quizCloseBtn = document.getElementById('quiz-close-btn');

        function showToast(text) {
            toastMsg.textContent = text;
            toastMsg.style.opacity = '1';
            toastMsg.style.transform = 'translate(-50%, -4px)';
            setTimeout(() => {
                toastMsg.style.opacity = '0';
                toastMsg.style.transform = 'translate(-50%, 0)';
            }, 2000);
        }

        function updateUI() {
            coinDisplay.textContent = coins;
            invCount.textContent = inventory.length;
            const totalVal = inventory.reduce((sum, item) => sum + CROP_CONFIG[item].sell, 0);
            sellValue.textContent = `(+${totalVal}🪙)`;
        }

        tabCropsBtn.addEventListener('click', () => {
            playSound('click');
            cropsPanel.classList.remove('hidden');
            buildPanel.classList.add('hidden');
            tabCropsBtn.className = "text-xs font-bold px-4 py-1.5 rounded-full bg-emerald-500 text-white shadow-sm transition-all flex items-center gap-1.5 cursor-pointer";
            tabBuildBtn.className = "text-xs font-bold px-4 py-1.5 rounded-full bg-white/70 text-slate-600 hover:bg-white transition-all flex items-center gap-1.5 cursor-pointer";
        });
        tabBuildBtn.addEventListener('click', () => {
            playSound('click');
            cropsPanel.classList.add('hidden');
            buildPanel.classList.remove('hidden');
            tabBuildBtn.className = "text-xs font-bold px-4 py-1.5 rounded-full bg-emerald-500 text-white shadow-sm transition-all flex items-center gap-1.5 cursor-pointer";
            tabCropsBtn.className = "text-xs font-bold px-4 py-1.5 rounded-full bg-white/70 text-slate-600 hover:bg-white transition-all flex items-center gap-1.5 cursor-pointer";
        });

        document.querySelectorAll('.crop-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                playSound('click');
                document.querySelectorAll('.crop-btn').forEach(b => b.classList.remove('crop-card-selected'));
                btn.classList.add('crop-card-selected');
                selectedCrop = btn.dataset.crop;
                const c = CROP_CONFIG[selectedCrop];
                selectedBanner.textContent = `🌱 กำลังเลือก: ${c.name} (ปลูก ${c.growTime} วิ)`;
            });
        });

        // 3D Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa5e2f7);
        scene.fog = new THREE.FogExp2(0xa5e2f7, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 18, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.minDistance = 10;
        controls.maxDistance = 45;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffbe6, 0.95);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Island Mesh
        const islandGeo = new THREE.CylinderGeometry(15, 12, 4, 7);
        const islandMat = new THREE.MeshLambertMaterial({ color: 0x86efac, flatShading: true });
        const island = new THREE.Mesh(islandGeo, islandMat);
        island.position.y = -2;
        island.receiveShadow = true;
        scene.add(island);

        function createTree(x, z, s = 1) {
            const grp = new THREE.Group();
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.25 * s, 0.35 * s, 2 * s, 5),
                new THREE.MeshLambertMaterial({ color: 0x8b5a2b, flatShading: true })
            );
            trunk.position.y = s;
            trunk.castShadow = true;
            grp.add(trunk);

            const foliage = new THREE.Mesh(
                new THREE.DodecahedronGeometry(1.4 * s, 1),
                new THREE.MeshLambertMaterial({ color: 0x34d399, flatShading: true })
            );
            foliage.position.y = 2.4 * s;
            foliage.castShadow = true;
            grp.add(foliage);

            grp.position.set(x, 0, z);
            scene.add(grp);
        }
        createTree(-8, -5, 1.2);
        createTree(-10, 2, 1.1);
        createTree(-8, 7, 1);
        createTree(8, -5, 1.2);
        createTree(10, 2, 1.1);
        createTree(8, 7, 1);
        createTree(-4, -9, 0.9);
        createTree(4, -9, 0.9);

        // Well Mesh
        const wellGroup = new THREE.Group();
        const wellBase = new THREE.Mesh(
            new THREE.CylinderGeometry(1.3, 1.3, 1.2, 8),
            new THREE.MeshLambertMaterial({ color: 0x94a3b8, flatShading: true })
        );
        wellBase.position.y = 0.6;
        wellBase.castShadow = true;
        wellGroup.add(wellBase);

        const wellRoof = new THREE.Mesh(
            new THREE.ConeGeometry(1.6, 1.1, 6),
            new THREE.MeshLambertMaterial({ color: 0xb45309, flatShading: true })
        );
        wellRoof.position.y = 1.9;
        wellRoof.castShadow = true;
        wellGroup.add(wellRoof);
        wellGroup.position.set(5.5, 0, 3.5);
        scene.add(wellGroup);

        // House Mesh
        const houseGroup = new THREE.Group();
        const houseBase = new THREE.Mesh(
            new THREE.BoxGeometry(4.5, 3, 4),
            new THREE.MeshLambertMaterial({ color: 0xd1d5db, flatShading: true })
        );
        houseBase.position.y = 1.5;
        houseBase.castShadow = true;
        houseBase.receiveShadow = true;
        houseGroup.add(houseBase);

        const houseRoof = new THREE.Mesh(
            new THREE.ConeGeometry(3.6, 2.2, 4),
            new THREE.MeshLambertMaterial({ color: 0xf87171, flatShading: true })
        );
        houseRoof.rotation.y = Math.PI / 4;
        houseRoof.position.y = 4.1;
        houseRoof.castShadow = true;
        houseGroup.add(houseRoof);

        const chimney = new THREE.Mesh(
            new THREE.BoxGeometry(0.6, 1.5, 0.6),
            new THREE.MeshLambertMaterial({ color: 0x9ca3af })
        );
        chimney.position.set(1.2, 4.2, -0.8);
        houseGroup.add(chimney);

        houseGroup.position.set(0, 0, -4.5);
        scene.add(houseGroup);

        const house2ndFloor = new THREE.Group();
        const houseTopBase = new THREE.Mesh(
            new THREE.BoxGeometry(3.6, 2.4, 3.2),
            new THREE.MeshLambertMaterial({ color: 0xcbd5e1, flatShading: true })
        );
        houseTopBase.position.y = 4.2;
        houseTopBase.castShadow = true;
        house2ndFloor.add(houseTopBase);
        house2ndFloor.visible = false;
        houseGroup.add(house2ndFloor);

        // Robot Mesh
        const robotGroup = new THREE.Group();
        const pedestal = new THREE.Mesh(
            new THREE.BoxGeometry(1.4, 1.8, 1.4),
            new THREE.MeshLambertMaterial({ color: 0xe2e8f0, flatShading: true })
        );
        pedestal.position.y = 0.9;
        robotGroup.add(pedestal);

        const robotBody = new THREE.Mesh(
            new THREE.BoxGeometry(0.9, 0.9, 0.8),
            new THREE.MeshLambertMaterial({ color: 0x3b82f6, flatShading: true })
        );
        robotBody.position.y = 2.25;
        robotBody.castShadow = true;
        robotGroup.add(robotBody);

        const robotEyes = new THREE.Mesh(
            new THREE.BoxGeometry(0.6, 0.2, 0.1),
            new THREE.MeshLambertMaterial({ color: 0xfacc15 })
        );
        robotEyes.position.set(0, 2.3, 0.41);
        robotGroup.add(robotEyes);

        const canvasTag = document.createElement('canvas');
        canvasTag.width = 128;
        canvasTag.height = 64;
        const ctxTag = canvasTag.getContext('2d');
        ctxTag.fillStyle = '#1e293b';
        ctxTag.roundRect(0, 0, 128, 64, 16);
        ctxTag.fill();
        ctxTag.fillStyle = '#ffffff';
        ctxTag.font = 'bold 28px sans-serif';
        ctxTag.textAlign = 'center';
        ctxTag.fillText('QUIZ 🤖', 64, 42);
        const tagTex = new THREE.CanvasTexture(canvasTag);
        const tagSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tagTex }));
        tagSprite.position.set(0, 3.2, 0);
        tagSprite.scale.set(1.6, 0.8, 1);
        robotGroup.add(tagSprite);

        const robotHitbox = new THREE.Mesh(
            new THREE.BoxGeometry(2, 3.5, 2),
            new THREE.MeshBasicMaterial({ visible: false })
        );
        robotHitbox.position.y = 1.75;
        robotHitbox.userData = { isRobot: true };
        robotGroup.add(robotHitbox);

        robotGroup.position.set(-5.5, 0, 1.5);
        scene.add(robotGroup);

        // Plots (12 Plots)
        const plots = [];
        const plotGeo = new THREE.BoxGeometry(1.6, 0.3, 1.6);
        const dryMat = new THREE.MeshLambertMaterial({ color: 0x475569 });
        const wetMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });

        const plotCoords = [
            { x: -4.5, z: 3.5 },
            { x: -2.7, z: 3.5 },
            { x: -0.9, z: 3.5 },
            { x: 0.9, z: 3.5 },
            { x: 2.7, z: 3.5 },
            { x: 4.5, z: 3.5 },
            { x: -4.5, z: 1.5 },
            { x: -2.7, z: 1.5 },
            { x: -0.9, z: 1.5 },
            { x: 0.9, z: 1.5 },
            { x: 2.7, z: 1.5 },
            { x: 4.5, z: 1.5 }
        ];

        plotCoords.forEach((coord, idx) => {
            const plotGroup = new THREE.Group();
            plotGroup.position.set(coord.x, 0, coord.z);

            const plotMesh = new THREE.Mesh(plotGeo, dryMat.clone());
            plotMesh.position.y = 0.15;
            plotMesh.receiveShadow = true;
            plotGroup.add(plotMesh);

            const hitbox = new THREE.Mesh(
                new THREE.BoxGeometry(1.7, 1.2, 1.7),
                new THREE.MeshBasicMaterial({ visible: false })
            );
            hitbox.position.y = 0.6;
            hitbox.userData = { plotIndex: idx, isPlot: true };
            plotGroup.add(hitbox);

            plotGroup.visible = (idx < activePlotsCount);
            scene.add(plotGroup);

            plots.push({
                group: plotGroup,
                mesh: plotMesh,
                hitbox: hitbox,
                state: 'EMPTY',
                cropType: null,
                plantMesh: null,
                progressSprite: null,
                growTimer: 0,
                targetTime: 0
            });
        });

        // Sprinkler Particle
        const waterParticles = [];
        const pGeo = new THREE.DodecahedronGeometry(0.12, 0);
        const pMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
        for (let i = 0; i < 40; i++) {
            const p = new THREE.Mesh(pGeo, pMat);
            p.visible = false;
            scene.add(p);
            waterParticles.push({ mesh: p, vx: 0, vy: 0, vz: 0, active: false });
        }

        function triggerWaterSprinkler() {
            playSound('water');
            waterParticles.forEach(p => {
                p.mesh.position.set(-5.5, 2.5, 1.5);
                p.mesh.visible = true;
                p.vx = (Math.random() - 0.2) * 0.25;
                p.vy = 0.15 + Math.random() * 0.15;
                p.vz = (Math.random() - 0.5) * 0.25;
                p.active = true;
            });
        }

        function updatePlotBadge(plot, text, bgColor = '#0284c7') {
            if (!plot.progressSprite) {
                const cvs = document.createElement('canvas');
                cvs.width = 128;
                cvs.height = 48;
                const tex = new THREE.CanvasTexture(cvs);
                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex }));
                sprite.position.set(0, 1.4, 0);
                sprite.scale.set(1.4, 0.5, 1);
                plot.group.add(sprite);
                plot.progressSprite = sprite;
            }

            const canvas = plot.progressSprite.material.map.image;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 128, 48);
            ctx.fillStyle = bgColor;
            ctx.roundRect(4, 4, 120, 40, 12);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(text, 64, 32);
            plot.progressSprite.material.map.needsUpdate = true;
        }

        function removePlotBadge(plot) {
            if (plot.progressSprite) {
                plot.group.remove(plot.progressSprite);
                plot.progressSprite.material.dispose();
                plot.progressSprite = null;
            }
        }

        function plantSeed(plotIdx) {
            const plot = plots[plotIdx];
            if (plot.state !== 'EMPTY') return;

            const cfg = CROP_CONFIG[selectedCrop];
            if (coins < cfg.cost) {
                playSound('wrong');
                showToast("❌ ยอดเงินไม่พอปลูก " + cfg.name);
                return;
            }

            coins -= cfg.cost;
            updateUI();
            playSound('plant');

            plot.state = 'SEEDED';
            plot.cropType = selectedCrop;
            plot.targetTime = cfg.growTime;
            plot.growTimer = 0;

            const seedGeo = new THREE.SphereGeometry(0.25, 8, 8);
            const seedMat = new THREE.MeshLambertMaterial({ color: 0x78350f });
            const seedMesh = new THREE.Mesh(seedGeo, seedMat);
            seedMesh.position.set(0, 0.35, 0);
            plot.group.add(seedMesh);
            plot.plantMesh = seedMesh;

            updatePlotBadge(plot, '💧 รอรดน้ำ', '#f59e0b');
            showToast(`🌱 หยอดเมล็ด ${cfg.name} สำเร็จ! กดหุ่นยนต์ 🤖 เพื่อตอบควิซรดน้ำ`);
        }

        function waterAllPlots() {
            let count = 0;
            plots.forEach(plot => {
                if (plot.state === 'SEEDED') {
                    plot.state = 'GROWING';
                    plot.mesh.material = wetMat;
                    count++;
                }
            });
            triggerWaterSprinkler();
            if (count > 0) {
                showToast(`💦 หุ่นยนต์รดน้ำให้ ${count} แปลงแล้ว! เริ่มเจริญเติบโตทันที`);
            } else {
                showToast(`🤖 หุ่นยนต์ฉีดน้ำเรียบร้อย (ยังไม่มีเมล็ดที่รอรดน้ำ)`);
            }
        }

        function updatePlantGrowth(delta) {
            plots.forEach(plot => {
                if (plot.state === 'GROWING') {
                    plot.growTimer += delta;
                    const progress = Math.min(1, plot.growTimer / plot.targetTime);
                    const percent = Math.floor(progress * 100);

                    updatePlotBadge(plot, `${percent}%`, '#0284c7');

                    if (plot.plantMesh) {
                        const s = 0.4 + progress * 0.9;
                        plot.plantMesh.scale.set(s, s, s);
                        plot.plantMesh.position.y = 0.35 + progress * 0.4;
                    }

                    if (progress >= 1) {
                        plot.state = 'MATURE';
                        playSound('mature');
                        plot.group.remove(plot.plantMesh);
                        const cfg = CROP_CONFIG[plot.cropType];
                        const matureGeo = new THREE.DodecahedronGeometry(0.55, 1);
                        const matureMat = new THREE.MeshLambertMaterial({ color: cfg.color, flatShading: true });
                        const matureMesh = new THREE.Mesh(matureGeo, matureMat);
                        matureMesh.position.set(0, 0.75, 0);
                        matureMesh.castShadow = true;
                        plot.group.add(matureMesh);
                        plot.plantMesh = matureMesh;

                        updatePlotBadge(plot, '✨ เก็บเกี่ยว', '#16a34a');
                    }
                }
            });
        }

        function harvestCrop(plotIdx) {
            const plot = plots[plotIdx];
            if (plot.state !== 'MATURE') return;

            const cfg = CROP_CONFIG[plot.cropType];
            inventory.push(plot.cropType);
            updateUI();
            playSound('harvest');

            plot.group.remove(plot.plantMesh);
            removePlotBadge(plot);
            plot.plantMesh = null;
            plot.state = 'EMPTY';
            plot.cropType = null;
            plot.growTimer = 0;
            plot.mesh.material = dryMat;

            showToast(`🎉 เก็บเกี่ยว +1 ${cfg.name}!`);
        }

        sellAllBtn.addEventListener('click', () => {
            if (inventory.length === 0) {
                playSound('wrong');
                showToast("⚠️ ไม่มีผลผลิตในคลังให้ขาย");
                return;
            }
            const earned = inventory.reduce((sum, item) => sum + CROP_CONFIG[item].sell, 0);
            coins += earned;
            inventory = [];
            updateUI();
            playSound('sell');
            showToast(`💰 ขายผลผลิตทั้งหมด ได้รับ +${earned} เหรียญ!`);
        });

        btnExpandPlot.addEventListener('click', () => {
            if (activePlotsCount >= 12) {
                playSound('wrong');
                showToast("✅ ขยายแปลงจนครบโควตา 12 แปลงแล้ว!");
                return;
            }
            if (coins < 150) {
                playSound('wrong');
                showToast("❌ ยอดเงินไม่พอ (ต้องการ 150 เหรียญ)");
                return;
            }

            coins -= 150;
            plots[activePlotsCount].group.visible = true;
            activePlotsCount++;
            updateUI();
            playSound('build');

            if (activePlotsCount < 12) {
                plotUpgradeTitle.textContent = `ขยายแปลง (${activePlotsCount}/12)`;
                showToast(`🔨 ขยายแปลงสำเร็จ! ตอนนี้มี ${activePlotsCount} แปลง`);
            } else {
                plotUpgradeTitle.textContent = `ขยายแปลงครบแล้ว (12/12)`;
                btnExpandPlot.classList.add('opacity-50', 'pointer-events-none');
                showToast(`🎉 ขยายแปลงครบ 12 แปลงเรียบร้อย!`);
            }
        });

        btnUpgradeHouse.addEventListener('click', () => {
            if (houseLevel >= 2) {
                playSound('wrong');
                showToast("✅ บ้านอัปเกรดเป็นระดับสูงสุดแล้ว");
                return;
            }
            if (coins < 300) {
                playSound('wrong');
                showToast("❌ ยอดเงินไม่พอต่อเติมบ้าน (ต้องการ 300 เหรียญ)");
                return;
            }
            coins -= 300;
            houseLevel = 2;
            house2ndFloor.visible = true;
            houseRoof.position.y = 5.8;
            chimney.position.y = 5.9;
            houseUpgradeTitle.textContent = "บ้านระดับสูงสุด (Lv.2)";
            btnUpgradeHouse.classList.add('opacity-50', 'pointer-events-none');
            updateUI();
            playSound('build');
            showToast("🏠 ต่อเติมบ้านชั้น 2 สำเร็จ! ปลดล็อกคฤหาสน์เกาะลอยฟ้า");
        });

        let currentQuizAnswer = 0;
        function openRobotQuiz() {
            playSound('robot');
            const a = Math.floor(Math.random() * 8) + 2;
            const b = Math.floor(Math.random() * 8) + 2;
            currentQuizAnswer = a * b;

            quizQuestion.textContent = `${a} * ${b} = ?`;

            const answers = new Set([currentQuizAnswer]);
            while (answers.size < 4) {
                const fake = currentQuizAnswer + (Math.floor(Math.random() * 11) - 5);
                if (fake > 0 && fake !== currentQuizAnswer) answers.add(fake);
            }
            const shuffled = Array.from(answers).sort(() => Math.random() - 0.5);

            quizOptions.innerHTML = '';
            shuffled.forEach(ans => {
                const btn = document.createElement('button');
                btn.className = "py-3 rounded-xl bg-blue-500 hover:bg-blue-600 active:scale-95 text-white font-black text-lg shadow border-b-4 border-blue-700 transition-all cursor-pointer";
                btn.textContent = ans;
                btn.onclick = () => {
                    quizModal.classList.add('hidden');
                    if (ans === currentQuizAnswer) {
                        waterAllPlots();
                    } else {
                        playSound('wrong');
                        showToast("❌ ตอบผิด! หุ่นยนต์ไม่ยอมรดน้ำให้");
                    }
                };
                quizOptions.appendChild(btn);
            });

            quizModal.classList.remove('hidden');
        }

        quizCloseBtn.addEventListener('click', () => {
            playSound('click');
            quizModal.classList.add('hidden');
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let pointerDownPos = { x: 0, y: 0 };
        let pointerDownTime = 0;

        window.addEventListener('pointerdown', (e) => {
            pointerDownPos = { x: e.clientX, y: e.clientY };
            pointerDownTime = performance.now();
        });

        window.addEventListener('pointerup', (e) => {
            const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            const duration = performance.now() - pointerDownTime;

            if (dist > 10 || duration > 500) return;
            if (e.target.closest('#quiz-modal') || e.target.closest('.hud-glass') || e.target.closest('button')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const robotHits = raycaster.intersectObject(robotHitbox);
            if (robotHits.length > 0) {
                openRobotQuiz();
                return;
            }

            const activeHitboxes = plots.slice(0, activePlotsCount).map(p => p.hitbox);
            const plotHits = raycaster.intersectObjects(activeHitboxes);

            if (plotHits.length > 0) {
                const clickedIdx = plotHits[0].object.userData.plotIndex;
                const plot = plots[clickedIdx];

                if (plot.state === 'EMPTY') {
                    plantSeed(clickedIdx);
                } else if (plot.state === 'SEEDED') {
                    playSound('click');
                    showToast("💧 แปลงนี้หยอดเมล็ดแล้ว! กดที่หุ่นยนต์ 🤖 เพื่อตอบควิซรดน้ำ");
                } else if (plot.state === 'GROWING') {
                    playSound('click');
                    showToast("⏳ พืชกำลังเจริญเติบโต กรุณารอสักครู่...");
                } else if (plot.state === 'MATURE') {
                    harvestCrop(clickedIdx);
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            controls.update();
            updatePlantGrowth(delta);

            robotGroup.position.y = Math.sin(clock.getElapsedTime() * 3) * 0.08;

            waterParticles.forEach(p => {
                if (p.active) {
                    p.mesh.position.x += p.vx;
                    p.mesh.position.y += p.vy;
                    p.mesh.position.z += p.vz;
                    p.vy -= 0.008;

                    if (p.mesh.position.y <= 0.1) {
                        p.active = false;
                        p.mesh.visible = false;
                    }
                }
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
