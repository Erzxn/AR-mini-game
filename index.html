<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Dome 2099 - Hydroponic AI Lab</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Chakra Petch', sans-serif;
            user-select: none;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050814;
        }
        .hud-cyber {
            background: rgba(8, 14, 30, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.35);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(0, 240, 255, 0.05);
        }
        .crop-card-selected {
            border: 2px solid #00f0ff !important;
            background: rgba(0, 240, 255, 0.18) !important;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }
        .scanlines {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }
    </style>
</head>
<body class="relative w-screen h-screen">

    <!-- 3D Canvas -->
    <div id="canvas-container" class="w-full h-full cursor-grab active:cursor-grabbing"></div>
    <div class="scanlines absolute inset-0 z-10 pointer-events-none"></div>

    <!-- Top Left: Bio-Credits -->
    <div class="absolute top-5 left-5 z-20 pointer-events-auto">
        <div class="hud-cyber rounded-2xl px-5 py-3 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-cyan-950 border border-cyan-400 flex items-center justify-center text-cyan-300 text-lg shadow-[0_0_12px_rgba(0,240,255,0.5)] font-bold">
                ⬡
            </div>
            <div>
                <div class="text-[10px] text-cyan-400 font-orbitron tracking-widest uppercase">BIO-CREDITS</div>
                <div id="coin-display" class="text-2xl font-orbitron font-black text-white leading-tight drop-shadow-[0_0_8px_rgba(0,240,255,0.6)]">100</div>
            </div>
        </div>
    </div>

    <!-- Top Right: Silo & Export -->
    <div class="absolute top-5 right-5 z-20 flex flex-col items-end gap-2.5 pointer-events-auto">
        <div class="hud-cyber rounded-2xl px-5 py-3 flex items-center gap-3">
            <span class="text-xl text-emerald-400">❖</span>
            <div class="text-right">
                <div class="text-[10px] text-emerald-400 font-orbitron tracking-widest uppercase">CARGO SILO</div>
                <div class="text-base font-orbitron font-bold text-white"><span id="inventory-count">0</span> UNITS</div>
            </div>
        </div>
        <button id="sell-all-btn" class="bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 active:scale-95 text-slate-950 font-orbitron font-black px-6 py-2.5 rounded-xl shadow-[0_0_20px_rgba(0,255,180,0.4)] border border-white/40 transition-all flex items-center gap-2 cursor-pointer">
            <span>EXPORT ALL</span>
            <span id="sell-value" class="text-xs bg-slate-950/40 text-cyan-100 px-2 py-0.5 rounded-full font-mono">(+0⬡)</span>
        </button>
    </div>

    <!-- Toast Notification -->
    <div id="toast-msg" class="absolute top-20 left-1/2 -translate-x-1/2 z-30 opacity-0 pointer-events-none transition-all duration-300 bg-slate-950/90 text-cyan-300 text-sm font-bold px-6 py-2.5 rounded-full backdrop-blur-md border border-cyan-500/40 shadow-[0_0_20px_rgba(0,240,255,0.3)]">
        SYSTEM READY
    </div>

    <!-- Bottom Center HUD: Biological Cultivation Unit -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 w-full max-w-lg px-4 pointer-events-auto">
        <div class="hud-cyber rounded-3xl p-4">
            <!-- Selected Specimen Banner -->
            <div class="text-center mb-3">
                <span id="selected-banner" class="inline-block bg-cyan-950/70 border border-cyan-500/40 text-cyan-300 font-semibold text-xs px-5 py-1.5 rounded-full shadow-inner">
                    ◈ SELECTED: มะเขือเทศไซเบอร์ (5 วินาที)
                </span>
            </div>

            <!-- Tab Switcher -->
            <div class="flex justify-center gap-2 mb-3 border-b border-cyan-500/20 pb-2.5">
                <button id="tab-crops-btn" class="text-xs font-orbitron font-bold px-5 py-1.5 rounded-full bg-cyan-500 text-slate-950 shadow-[0_0_12px_rgba(0,240,255,0.6)] transition-all flex items-center gap-1.5 cursor-pointer">
                    <span>🧬</span> BIO-SEEDS
                </button>
                <button id="tab-build-btn" class="text-xs font-orbitron font-bold px-5 py-1.5 rounded-full bg-slate-900/60 text-slate-400 hover:text-cyan-300 transition-all flex items-center gap-1.5 border border-slate-700 cursor-pointer">
                    <span>⚡</span> MODULE EXPANSION
                </button>
            </div>

            <!-- Panel 1: Seeds -->
            <div id="crops-panel" class="grid grid-cols-3 gap-2.5">
                <button class="crop-btn crop-card-selected bg-slate-900/80 rounded-2xl p-2.5 flex flex-col items-center border border-cyan-900 transition-all cursor-pointer" data-crop="tomato">
                    <span class="text-2xl mb-1">🔴</span>
                    <span class="text-xs font-bold text-slate-200">นีออน โทมาโท</span>
                    <div class="text-[10px] text-slate-400 mt-0.5">ทุน <b class="text-cyan-400">10</b> | ขาย <b class="text-emerald-400">25</b></div>
                </button>
                <button class="crop-btn bg-slate-900/80 rounded-2xl p-2.5 flex flex-col items-center border border-cyan-900 transition-all hover:bg-slate-800/80 cursor-pointer" data-crop="carrot">
                    <span class="text-2xl mb-1">🔶</span>
                    <span class="text-xs font-bold text-slate-200">โครโน แครอท</span>
                    <div class="text-[10px] text-slate-400 mt-0.5">ทุน <b class="text-cyan-400">20</b> | ขาย <b class="text-emerald-400">60</b></div>
                </button>
                <button class="crop-btn bg-slate-900/80 rounded-2xl p-2.5 flex flex-col items-center border border-cyan-900 transition-all hover:bg-slate-800/80 cursor-pointer" data-crop="cabbage">
                    <span class="text-2xl mb-1">🟢</span>
                    <span class="text-xs font-bold text-slate-200">พลาสมา แคบเบจ</span>
                    <div class="text-[10px] text-slate-400 mt-0.5">ทุน <b class="text-cyan-400">50</b> | ขาย <b class="text-emerald-400">200</b></div>
                </button>
            </div>

            <!-- Panel 2: Modules -->
            <div id="build-panel" class="hidden grid grid-cols-2 gap-3">
                <button id="btn-expand-plot" class="bg-slate-900/80 rounded-2xl p-3 flex flex-col items-center border border-cyan-900 hover:border-cyan-500/50 transition-all active:scale-95 cursor-pointer">
                    <span class="text-2xl mb-1 text-cyan-400">⬡</span>
                    <span id="plot-upgrade-title" class="text-xs font-bold text-slate-200">ขยาย Hydro-Pad (6/12)</span>
                    <div class="text-[11px] font-orbitron font-bold text-cyan-400 mt-1 flex items-center gap-1">
                        <span>150 ⬡</span>
                        <span class="text-[9px] text-slate-500 font-normal">(+1 แพลตฟอร์ม)</span>
                    </div>
                </button>
                <button id="btn-upgrade-house" class="bg-slate-900/80 rounded-2xl p-3 flex flex-col items-center border border-cyan-900 hover:border-cyan-500/50 transition-all active:scale-95 cursor-pointer">
                    <span class="text-2xl mb-1 text-emerald-400">🏢</span>
                    <span id="house-upgrade-title" class="text-xs font-bold text-slate-200">อัปเกรดสถานีวิจัย Lv.2</span>
                    <div class="text-[11px] font-orbitron font-bold text-emerald-400 mt-1">300 ⬡</div>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Robot Quiz Terminal -->
    <div id="quiz-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="hud-cyber rounded-3xl max-w-sm w-full p-6 text-center border-2 border-cyan-400/60 shadow-[0_0_40px_rgba(0,240,255,0.3)]">
            <div class="w-16 h-16 mx-auto mb-2 bg-cyan-950 border-2 border-cyan-400 rounded-2xl flex items-center justify-center text-3xl shadow-[0_0_15px_rgba(0,240,255,0.5)] animate-pulse">
                🤖
            </div>
            <h3 class="text-xl font-orbitron font-black text-cyan-300">AERO-BOT // TERMINAL</h3>
            <p class="text-xs text-slate-300 mt-1 mb-4">
                ไขรหัสคำนวณสารอาหารเพื่อปล่อยไฮโดรโซลูชันสู่แปลงปลูก!<br>
                <span class="text-rose-400 text-[11px] font-bold">*เมล็ดชีวภาพจะไม่เจริญเติบโตหากไร้สารอาหาร*</span>
            </p>

            <div class="bg-slate-950/90 border border-cyan-500/40 rounded-2xl py-4 px-6 mb-4 shadow-inner">
                <span id="quiz-question" class="text-3xl font-orbitron font-black text-white tracking-widest">4 * 5 = ?</span>
            </div>

            <div id="quiz-options" class="grid grid-cols-2 gap-2.5"></div>

            <button id="quiz-close-btn" class="mt-4 text-xs font-orbitron font-bold text-slate-500 hover:text-cyan-400 transition-colors cursor-pointer uppercase">
                [ ABORT TERMINAL ]
            </button>
        </div>
    </div>

    <!-- Logic Script & Web Audio Synthesizer -->
    <script>
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.04);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.04);
                } else if (type === 'plant') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(250, now);
                    osc.frequency.linearRampToValueAtTime(500, now + 0.1);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'robot') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.setValueAtTime(880, now + 0.06);
                    osc.frequency.setValueAtTime(1174.66, now + 0.12);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.22);
                } else if (type === 'water') {
                    const bufferSize = ctx.sampleRate * 0.45;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, now);
                    filter.frequency.linearRampToValueAtTime(2200, now + 0.3);
                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);
                    noise.start(now);
                } else if (type === 'wrong') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.setValueAtTime(110, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'mature') {
                    const freqs = [659.25, 880, 1318.51];
                    freqs.forEach((f, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = f;
                        const t = now + i * 0.05;
                        gain.gain.setValueAtTime(0.12, t);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(t);
                        osc.stop(t + 0.2);
                    });
                } else if (type === 'harvest') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(450, now);
                    osc.frequency.exponentialRampToValueAtTime(950, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.18);
                } else if (type === 'sell') {
                    [1046.5, 1318.51, 1567.98].forEach((f, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = f;
                        const t = now + i * 0.06;
                        gain.gain.setValueAtTime(0.18, t);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(t);
                        osc.stop(t + 0.25);
                    });
                } else if (type === 'build') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch (e) {
                console.warn(e);
            }
        }

        // Game State
        let coins = 100;
        let inventory = [];
        let selectedCrop = 'tomato';
        let activePlotsCount = 6;
        let houseLevel = 1;

        const CROP_CONFIG = {
            tomato: { name: 'นีออน โทมาโท', icon: '🔴', cost: 10, sell: 25, growTime: 5, color: 0xff0055 },
            carrot: { name: 'โครโน แครอท', icon: '🔶', cost: 20, sell: 60, growTime: 7, color: 0xffaa00 },
            cabbage: { name: 'พลาสมา แคบเบจ', icon: '🟢', cost: 50, sell: 200, growTime: 10, color: 0x00ffaa }
        };

        const coinDisplay = document.getElementById('coin-display');
        const invCount = document.getElementById('inventory-count');
        const sellValue = document.getElementById('sell-value');
        const sellAllBtn = document.getElementById('sell-all-btn');
        const toastMsg = document.getElementById('toast-msg');
        const selectedBanner = document.getElementById('selected-banner');
        const cropsPanel = document.getElementById('crops-panel');
        const buildPanel = document.getElementById('build-panel');
        const tabCropsBtn = document.getElementById('tab-crops-btn');
        const tabBuildBtn = document.getElementById('tab-build-btn');
        const btnExpandPlot = document.getElementById('btn-expand-plot');
        const plotUpgradeTitle = document.getElementById('plot-upgrade-title');
        const btnUpgradeHouse = document.getElementById('btn-upgrade-house');
        const houseUpgradeTitle = document.getElementById('house-upgrade-title');
        const quizModal = document.getElementById('quiz-modal');
        const quizQuestion = document.getElementById('quiz-question');
        const quizOptions = document.getElementById('quiz-options');
        const quizCloseBtn = document.getElementById('quiz-close-btn');

        function showToast(text) {
            toastMsg.textContent = text;
            toastMsg.style.opacity = '1';
            toastMsg.style.transform = 'translate(-50%, -4px)';
            setTimeout(() => {
                toastMsg.style.opacity = '0';
                toastMsg.style.transform = 'translate(-50%, 0)';
            }, 2000);
        }

        function updateUI() {
            coinDisplay.textContent = coins;
            invCount.textContent = inventory.length;
            const totalVal = inventory.reduce((sum, item) => sum + CROP_CONFIG[item].sell, 0);
            sellValue.textContent = `(+${totalVal}⬡)`;
        }

        tabCropsBtn.addEventListener('click', () => {
            playSound('click');
            cropsPanel.classList.remove('hidden');
            buildPanel.classList.add('hidden');
            tabCropsBtn.className = "text-xs font-orbitron font-bold px-5 py-1.5 rounded-full bg-cyan-500 text-slate-950 shadow-[0_0_12px_rgba(0,240,255,0.6)] transition-all flex items-center gap-1.5 cursor-pointer";
            tabBuildBtn.className = "text-xs font-orbitron font-bold px-5 py-1.5 rounded-full bg-slate-900/60 text-slate-400 hover:text-cyan-300 transition-all flex items-center gap-1.5 border border-slate-700 cursor-pointer";
        });
        tabBuildBtn.addEventListener('click', () => {
            playSound('click');
            cropsPanel.classList.add('hidden');
            buildPanel.classList.remove('hidden');
            tabBuildBtn.className = "text-xs font-orbitron font-bold px-5 py-1.5 rounded-full bg-cyan-500 text-slate-950 shadow-[0_0_12px_rgba(0,240,255,0.6)] transition-all flex items-center gap-1.5 cursor-pointer";
            tabCropsBtn.className = "text-xs font-orbitron font-bold px-5 py-1.5 rounded-full bg-slate-900/60 text-slate-400 hover:text-cyan-300 transition-all flex items-center gap-1.5 border border-slate-700 cursor-pointer";
        });

        document.querySelectorAll('.crop-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                playSound('click');
                document.querySelectorAll('.crop-btn').forEach(b => b.classList.remove('crop-card-selected'));
                btn.classList.add('crop-card-selected');
                selectedCrop = btn.dataset.crop;
                const c = CROP_CONFIG[selectedCrop];
                selectedBanner.textContent = `◈ SELECTED: ${c.name} (${c.growTime} วินาที)`;
            });
        });

        // 3D Scene Setup (Cyber Space Theme)
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050814);
        scene.fog = new THREE.FogExp2(0x050814, 0.018);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 18, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.minDistance = 10;
        controls.maxDistance = 45;

        // Cyber Lighting
        const ambientLight = new THREE.AmbientLight(0x2a3b5c, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00f0ff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const purpleLight = new THREE.PointLight(0xa855f7, 2, 40);
        purpleLight.position.set(-15, 10, -10);
        scene.add(purpleLight);

        // Cyber Platform (Hexagonal Tech Base)
        const islandGeo = new THREE.CylinderGeometry(15, 12, 3.5, 6);
        const islandMat = new THREE.MeshStandardMaterial({
            color: 0x0f172a,
            roughness: 0.4,
            metalness: 0.8,
            flatShading: true
        });
        const island = new THREE.Mesh(islandGeo, islandMat);
        island.position.y = -1.75;
        island.receiveShadow = true;
        scene.add(island);

        // Neon Edge Ring
        const ringGeo = new THREE.RingGeometry(14.6, 14.9, 6);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = 0.02;
        scene.add(ring);

        // Bio-Crystals (แทนต้นไม้)
        function createBioCrystal(x, z, s = 1) {
            const grp = new THREE.Group();
            const crystalGeo = new THREE.OctahedronGeometry(1.2 * s, 0);
            const crystalMat = new THREE.MeshStandardMaterial({
                color: 0x00f0ff,
                emissive: 0x0088aa,
                emissiveIntensity: 0.6,
                roughness: 0.1,
                metalness: 0.9,
                flatShading: true
            });
            const crystal = new THREE.Mesh(crystalGeo, crystalMat);
            crystal.scale.set(0.6, 1.8, 0.6);
            crystal.position.y = 1.6 * s;
            crystal.castShadow = true;
            grp.add(crystal);

            const baseGeo = new THREE.CylinderGeometry(0.5 * s, 0.7 * s, 0.6 * s, 5);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.3 * s;
            grp.add(base);

            grp.position.set(x, 0, z);
            scene.add(grp);
        }
        createBioCrystal(-8, -5, 1.2);
        createBioCrystal(-10, 2, 1.1);
        createBioCrystal(-8, 7, 1);
        createBioCrystal(8, -5, 1.2);
        createBioCrystal(10, 2, 1.1);
        createBioCrystal(8, 7, 1);
        createBioCrystal(-4, -9, 0.9);
        createBioCrystal(4, -9, 0.9);

        // Hydro Generator (แทนบ่อน้ำ)
        const wellGroup = new THREE.Group();
        const coreBase = new THREE.Mesh(
            new THREE.CylinderGeometry(1.4, 1.6, 1.4, 8),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.9, roughness: 0.2 })
        );
        coreBase.position.y = 0.7;
        coreBase.castShadow = true;
        wellGroup.add(coreBase);

        const coreEnergy = new THREE.Mesh(
            new THREE.SphereGeometry(0.8, 12, 12),
            new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true })
        );
        coreEnergy.position.y = 1.9;
        wellGroup.add(coreEnergy);
        wellGroup.position.set(5.5, 0, 3.5);
        scene.add(wellGroup);

        // Main Research Station (แทนบ้านไม้เดิม)
        const houseGroup = new THREE.Group();
        const stationBase = new THREE.Mesh(
            new THREE.BoxGeometry(4.6, 2.8, 4.2),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.3 })
        );
        stationBase.position.y = 1.4;
        stationBase.castShadow = true;
        stationBase.receiveShadow = true;
        houseGroup.add(stationBase);

        const stationDome = new THREE.Mesh(
            new THREE.CylinderGeometry(2, 2.6, 1.4, 8),
            new THREE.MeshStandardMaterial({ color: 0x0ea5e9, roughness: 0.2, metalness: 0.7 })
        );
        stationDome.position.y = 3.4;
        stationDome.castShadow = true;
        houseGroup.add(stationDome);

        // Antenna
        const antenna = new THREE.Mesh(
            new THREE.CylinderGeometry(0.08, 0.08, 2, 6),
            new THREE.MeshBasicMaterial({ color: 0x00f0ff })
        );
        antenna.position.set(1.4, 4.5, -1);
        houseGroup.add(antenna);

        houseGroup.position.set(0, 0, -4.5);
        scene.add(houseGroup);

        // Station Expansion Lv.2
        const house2ndFloor = new THREE.Group();
        const topDome = new THREE.Mesh(
            new THREE.SphereGeometry(1.8, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2),
            new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.9, roughness: 0.1, transparent: true, opacity: 0.85 })
        );
        topDome.position.y = 4.1;
        house2ndFloor.add(topDome);
        house2ndFloor.visible = false;
        houseGroup.add(house2ndFloor);

        // Spherical Aero-Bot (แทนหุ่นยนต์เหลี่ยมเดิม)
        const robotGroup = new THREE.Group();
        const pedestal = new THREE.Mesh(
            new THREE.CylinderGeometry(0.8, 1.1, 1.8, 6),
            new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9 })
        );
        pedestal.position.y = 0.9;
        robotGroup.add(pedestal);

        const botCore = new THREE.Mesh(
            new THREE.SphereGeometry(0.65, 16, 16),
            new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.8, roughness: 0.2 })
        );
        botCore.position.y = 2.4;
        robotGroup.add(botCore);

        const botRing = new THREE.Mesh(
            new THREE.TorusGeometry(0.9, 0.06, 8, 24),
            new THREE.MeshBasicMaterial({ color: 0x00f0ff })
        );
        botRing.rotation.x = Math.PI / 3;
        botRing.position.y = 2.4;
        robotGroup.add(botRing);

        const botEye = new THREE.Mesh(
            new THREE.SphereGeometry(0.2, 8, 8),
            new THREE.MeshBasicMaterial({ color: 0x22d3ee })
        );
        botEye.position.set(0, 2.4, 0.55);
        robotGroup.add(botEye);

        // Holographic Terminal Tag
        const canvasTag = document.createElement('canvas');
        canvasTag.width = 160;
        canvasTag.height = 64;
        const ctxTag = canvasTag.getContext('2d');
        ctxTag.fillStyle = 'rgba(2, 6, 23, 0.9)';
        ctxTag.roundRect(0, 0, 160, 64, 14);
        ctxTag.fill();
        ctxTag.lineWidth = 4;
        ctxTag.strokeStyle = '#00f0ff';
        ctxTag.stroke();
        ctxTag.fillStyle = '#00f0ff';
        ctxTag.font = 'bold 24px Orbitron, sans-serif';
        ctxTag.textAlign = 'center';
        ctxTag.fillText('AI TERMINAL', 80, 42);
        const tagTex = new THREE.CanvasTexture(canvasTag);
        const tagSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tagTex }));
        tagSprite.position.set(0, 3.5, 0);
        tagSprite.scale.set(1.8, 0.75, 1);
        robotGroup.add(tagSprite);

        const robotHitbox = new THREE.Mesh(
            new THREE.BoxGeometry(2.2, 3.8, 2.2),
            new THREE.MeshBasicMaterial({ visible: false })
        );
        robotHitbox.position.y = 1.9;
        robotHitbox.userData = { isRobot: true };
        robotGroup.add(robotHitbox);

        robotGroup.position.set(-5.5, 0, 1.5);
        scene.add(robotGroup);

        // Hydro-Pads (12 Plots)
        const plots = [];
        const plotGeo = new THREE.CylinderGeometry(0.95, 1.05, 0.3, 6);
        const dryMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.7, roughness: 0.5 });
        const wetMat = new THREE.MeshStandardMaterial({
            color: 0x0284c7,
            emissive: 0x0369a1,
            emissiveIntensity: 0.5,
            metalness: 0.9
        });

        const plotCoords = [
            { x: -4.5, z: 3.5 },
            { x: -2.7, z: 3.5 },
            { x: -0.9, z: 3.5 },
            { x: 0.9, z: 3.5 },
            { x: 2.7, z: 3.5 },
            { x: 4.5, z: 3.5 },
            { x: -4.5, z: 1.5 },
            { x: -2.7, z: 1.5 },
            { x: -0.9, z: 1.5 },
            { x: 0.9, z: 1.5 },
            { x: 2.7, z: 1.5 },
            { x: 4.5, z: 1.5 }
        ];

        plotCoords.forEach((coord, idx) => {
            const plotGroup = new THREE.Group();
            plotGroup.position.set(coord.x, 0, coord.z);

            const plotMesh = new THREE.Mesh(plotGeo, dryMat.clone());
            plotMesh.position.y = 0.15;
            plotMesh.receiveShadow = true;
            plotGroup.add(plotMesh);

            const hitbox = new THREE.Mesh(
                new THREE.BoxGeometry(1.8, 1.3, 1.8),
                new THREE.MeshBasicMaterial({ visible: false })
            );
            hitbox.position.y = 0.65;
            hitbox.userData = { plotIndex: idx, isPlot: true };
            plotGroup.add(hitbox);

            plotGroup.visible = (idx < activePlotsCount);
            scene.add(plotGroup);

            plots.push({
                group: plotGroup,
                mesh: plotMesh,
                hitbox: hitbox,
                state: 'EMPTY',
                cropType: null,
                plantMesh: null,
                progressSprite: null,
                growTimer: 0,
                targetTime: 0
            });
        });

        // Hydro Solution Particles (Cyan Mist)
        const waterParticles = [];
        const pGeo = new THREE.TetrahedronGeometry(0.12, 0);
        const pMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
        for (let i = 0; i < 40; i++) {
            const p = new THREE.Mesh(pGeo, pMat);
            p.visible = false;
            scene.add(p);
            waterParticles.push({ mesh: p, vx: 0, vy: 0, vz: 0, active: false });
        }

        function triggerWaterSprinkler() {
            playSound('water');
            waterParticles.forEach(p => {
                p.mesh.position.set(-5.5, 2.5, 1.5);
                p.mesh.visible = true;
                p.vx = (Math.random() - 0.2) * 0.28;
                p.vy = 0.16 + Math.random() * 0.16;
                p.vz = (Math.random() - 0.5) * 0.28;
                p.active = true;
            });
        }

        function updatePlotBadge(plot, text, color = '#00f0ff') {
            if (!plot.progressSprite) {
                const cvs = document.createElement('canvas');
                cvs.width = 140;
                cvs.height = 48;
                const tex = new THREE.CanvasTexture(cvs);
                const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex }));
                sprite.position.set(0, 1.5, 0);
                sprite.scale.set(1.5, 0.5, 1);
                plot.group.add(sprite);
                plot.progressSprite = sprite;
            }

            const canvas = plot.progressSprite.material.map.image;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 140, 48);
            ctx.fillStyle = 'rgba(2, 6, 23, 0.85)';
            ctx.roundRect(4, 4, 132, 40, 10);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = color;
            ctx.stroke();
            ctx.fillStyle = color;
            ctx.font = 'bold 20px Chakra Petch, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(text, 70, 31);
            plot.progressSprite.material.map.needsUpdate = true;
        }

        function removePlotBadge(plot) {
            if (plot.progressSprite) {
                plot.group.remove(plot.progressSprite);
                plot.progressSprite.material.dispose();
                plot.progressSprite = null;
            }
        }

        function plantSeed(plotIdx) {
            const plot = plots[plotIdx];
            if (plot.state !== 'EMPTY') return;

            const cfg = CROP_CONFIG[selectedCrop];
            if (coins < cfg.cost) {
                playSound('wrong');
                showToast("⬡ BIO-CREDITS ไม่เพียงพอ");
                return;
            }

            coins -= cfg.cost;
            updateUI();
            playSound('plant');

            plot.state = 'SEEDED';
            plot.cropType = selectedCrop;
            plot.targetTime = cfg.growTime;
            plot.growTimer = 0;

            const seedGeo = new THREE.OctahedronGeometry(0.25, 0);
            const seedMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7 });
            const seedMesh = new THREE.Mesh(seedGeo, seedMat);
            seedMesh.position.set(0, 0.35, 0);
            plot.group.add(seedMesh);
            plot.plantMesh = seedMesh;

            updatePlotBadge(plot, '⚡ รอดูดซึม', '#f59e0b');
            showToast(`🧬 นำพาเซลล์ ${cfg.name} ลงแท่น! ตอบควิซเพื่อป้อนสารอาหาร`);
        }

        function waterAllPlots() {
            let count = 0;
            plots.forEach(plot => {
                if (plot.state === 'SEEDED') {
                    plot.state = 'GROWING';
                    plot.mesh.material = wetMat;
                    count++;
                }
            });
            triggerWaterSprinkler();
            if (count > 0) {
                showToast(`🧪 ป้อนไฮโดรโซลูชันสู่ ${count} แท่นเพาะปลูก!`);
            } else {
                showToast(`🤖 สแกนเนอร์ทำงานปกติ (ไม่พบแท่นที่บรรจุเซลล์)`);
            }
        }

        function updatePlantGrowth(delta) {
            plots.forEach(plot => {
                if (plot.state === 'GROWING') {
                    plot.growTimer += delta;
                    const progress = Math.min(1, plot.growTimer / plot.targetTime);
                    const percent = Math.floor(progress * 100);

                    updatePlotBadge(plot, `${percent}%`, '#00f0ff');

                    if (plot.plantMesh) {
                        const s = 0.4 + progress * 0.9;
                        plot.plantMesh.scale.set(s, s, s);
                        plot.plantMesh.position.y = 0.35 + progress * 0.4;
                        plot.plantMesh.rotation.y += delta * 1.5;
                    }

                    if (progress >= 1) {
                        plot.state = 'MATURE';
                        playSound('mature');
                        plot.group.remove(plot.plantMesh);
                        const cfg = CROP_CONFIG[plot.cropType];
                        const matureGeo = new THREE.DodecahedronGeometry(0.55, 1);
                        const matureMat = new THREE.MeshStandardMaterial({
                            color: cfg.color,
                            emissive: cfg.color,
                            emissiveIntensity: 0.4,
                            metalness: 0.4,
                            roughness: 0.2
                        });
                        const matureMesh = new THREE.Mesh(matureGeo, matureMat);
                        matureMesh.position.set(0, 0.8, 0);
                        matureMesh.castShadow = true;
                        plot.group.add(matureMesh);
                        plot.plantMesh = matureMesh;

                        updatePlotBadge(plot, '◈ พร้อมสกัด', '#10b981');
                    }
                }
            });
        }

        function harvestCrop(plotIdx) {
            const plot = plots[plotIdx];
            if (plot.state !== 'MATURE') return;

            const cfg = CROP_CONFIG[plot.cropType];
            inventory.push(plot.cropType);
            updateUI();
            playSound('harvest');

            plot.group.remove(plot.plantMesh);
            removePlotBadge(plot);
            plot.plantMesh = null;
            plot.state = 'EMPTY';
            plot.cropType = null;
            plot.growTimer = 0;
            plot.mesh.material = dryMat;

            showToast(`📦 สกัด +1 ${cfg.name} เข้าสู่ Silo!`);
        }

        sellAllBtn.addEventListener('click', () => {
            if (inventory.length === 0) {
                playSound('wrong');
                showToast("⚠️ Silo ว่างเปล่า ไม่มีทรัพยากร");
                return;
            }
            const earned = inventory.reduce((sum, item) => sum + CROP_CONFIG[item].sell, 0);
            coins += earned;
            inventory = [];
            updateUI();
            playSound('sell');
            showToast(`⬡ ถ่ายโอนข้อมูลและส่งออก ได้รับ +${earned} BIO-CREDITS!`);
        });

        // Expand Hydro-Pad (150 Credits each)
        btnExpandPlot.addEventListener('click', () => {
            if (activePlotsCount >= 12) {
                playSound('wrong');
                showToast("✅ ขยายขีดความสามารถครบ 12 แท่นแล้ว");
                return;
            }
            if (coins < 150) {
                playSound('wrong');
                showToast("⬡ ต้องการ 150 BIO-CREDITS");
                return;
            }

            coins -= 150;
            plots[activePlotsCount].group.visible = true;
            activePlotsCount++;
            updateUI();
            playSound('build');

            if (activePlotsCount < 12) {
                plotUpgradeTitle.textContent = `ขยาย Hydro-Pad (${activePlotsCount}/12)`;
                showToast(`⚡ ปลดล็อกแท่นเพาะเลี้ยงที่ ${activePlotsCount} สำเร็จ!`);
            } else {
                plotUpgradeTitle.textContent = `ขยายครบพิกัดแล้ว (12/12)`;
                btnExpandPlot.classList.add('opacity-50', 'pointer-events-none');
                showToast(`🎉 ขยายแท่นเพาะเลี้ยงครบ 12 จุด!`);
            }
        });

        // Upgrade Station (300 Credits)
        btnUpgradeHouse.addEventListener('click', () => {
            if (houseLevel >= 2) {
                playSound('wrong');
                showToast("✅ สถานีอัปเกรดเป็นระดับสูงสุดแล้ว");
                return;
            }
            if (coins < 300) {
                playSound('wrong');
                showToast("⬡ ต้องการ 300 BIO-CREDITS");
                return;
            }
            coins -= 300;
            houseLevel = 2;
            house2ndFloor.visible = true;
            stationDome.position.y = 4.6;
            antenna.position.y = 6.2;
            houseUpgradeTitle.textContent = "สถานีวิจัยหลัก (Lv.2 MAX)";
            btnUpgradeHouse.classList.add('opacity-50', 'pointer-events-none');
            updateUI();
            playSound('build');
            showToast("🏢 อัปเกรดโดมสังเกตการณ์ชีวภาพระดับ 2 สมบูรณ์!");
        });

        // Quiz Logic
        let currentQuizAnswer = 0;
        function openRobotQuiz() {
            playSound('robot');
            const a = Math.floor(Math.random() * 8) + 2;
            const b = Math.floor(Math.random() * 8) + 2;
            currentQuizAnswer = a * b;

            quizQuestion.textContent = `${a} * ${b} = ?`;

            const answers = new Set([currentQuizAnswer]);
            while (answers.size < 4) {
                const fake = currentQuizAnswer + (Math.floor(Math.random() * 11) - 5);
                if (fake > 0 && fake !== currentQuizAnswer) answers.add(fake);
            }
            const shuffled = Array.from(answers).sort(() => Math.random() - 0.5);

            quizOptions.innerHTML = '';
            shuffled.forEach(ans => {
                const btn = document.createElement('button');
                btn.className = "py-3 rounded-xl bg-cyan-950/80 hover:bg-cyan-500 hover:text-slate-950 active:scale-95 text-cyan-300 font-orbitron font-bold text-lg border border-cyan-500/50 transition-all cursor-pointer shadow-[0_0_10px_rgba(0,240,255,0.2)]";
                btn.textContent = ans;
                btn.onclick = () => {
                    quizModal.classList.add('hidden');
                    if (ans === currentQuizAnswer) {
                        waterAllPlots();
                    } else {
                        playSound('wrong');
                        showToast("❌ รหัสผิดพลาด! ระบบปฏิเสธการจ่ายสารละลาย");
                    }
                };
                quizOptions.appendChild(btn);
            });

            quizModal.classList.remove('hidden');
        }

        quizCloseBtn.addEventListener('click', () => {
            playSound('click');
            quizModal.classList.add('hidden');
        });

        // Pointer Click & Raycast
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let pointerDownPos = { x: 0, y: 0 };
        let pointerDownTime = 0;

        window.addEventListener('pointerdown', (e) => {
            pointerDownPos = { x: e.clientX, y: e.clientY };
            pointerDownTime = performance.now();
        });

        window.addEventListener('pointerup', (e) => {
            const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            const duration = performance.now() - pointerDownTime;

            if (dist > 10 || duration > 500) return;
            if (e.target.closest('#quiz-modal') || e.target.closest('.hud-cyber') || e.target.closest('button')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const robotHits = raycaster.intersectObject(robotHitbox);
            if (robotHits.length > 0) {
                openRobotQuiz();
                return;
            }

            const activeHitboxes = plots.slice(0, activePlotsCount).map(p => p.hitbox);
            const plotHits = raycaster.intersectObjects(activeHitboxes);

            if (plotHits.length > 0) {
                const clickedIdx = plotHits[0].object.userData.plotIndex;
                const plot = plots[clickedIdx];

                if (plot.state === 'EMPTY') {
                    plantSeed(clickedIdx);
                } else if (plot.state === 'SEEDED') {
                    playSound('click');
                    showToast("⚡ แท่นนี้รอดูดซึม! แตะโดรน AI เพื่อป้อนสารอาหาร");
                } else if (plot.state === 'GROWING') {
                    playSound('click');
                    showToast("⏳ โครงสร้างเซลล์กำลังเจริญเติบโต...");
                } else if (plot.state === 'MATURE') {
                    harvestCrop(clickedIdx);
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            controls.update();
            updatePlantGrowth(delta);

            // Bot & Energy Core Float Animations
            robotGroup.position.y = Math.sin(clock.getElapsedTime() * 2.5) * 0.12;
            botRing.rotation.z += delta * 1.5;
            coreEnergy.rotation.y += delta;
            coreEnergy.rotation.x += delta * 0.5;

            waterParticles.forEach(p => {
                if (p.active) {
                    p.mesh.position.x += p.vx;
                    p.mesh.position.y += p.vy;
                    p.mesh.position.z += p.vz;
                    p.vy -= 0.009;

                    if (p.mesh.position.y <= 0.1) {
                        p.active = false;
                        p.mesh.visible = false;
                    }
                }
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
